[package]
name = "nmm-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
zip = { version = "9", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma"] }
sevenz-rust2 = { version = "0.23", default-features = false, features = ["bzip2", "ppmd", "util", "deflate"] }
unrar = "0.5"
dirs = "6"
walkdir = "2"
thiserror = "2"
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "rustls", "charset", "system-proxy"] }

[dev-dependencies]
tempfile = "3"
