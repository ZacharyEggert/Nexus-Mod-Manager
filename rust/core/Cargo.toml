[package]
name = "nmm-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
zip = { version = "9", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma"] }
sevenz-rust2 = { version = "0.23", default-features = false, features = ["bzip2", "ppmd", "util", "deflate"] }
unrar = "0.5"
dirs = "6"
walkdir = "2"
thiserror = "2"
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "rustls", "charset", "system-proxy"] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.28.0", features = ["v4"] }
md5 = "0.8.1"
esplugin = "6"
libloot = "0.29"

[dev-dependencies]
tempfile = "3"
